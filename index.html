<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina AI - Smart Lighting</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070B14;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --ai-accent: #8b5cf6;
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Vùng điều khiển trung tâm */
    .control-center {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 240px;
      margin-bottom: 20px;
    }

    /* Nút ghi âm (Mic) */
    #btn-record {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.8));
      backdrop-filter: blur(10px);
      color: var(--text-main);
      font-size: 40px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.5),
        inset 0 2px 0 rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
    }

    #btn-record:hover {
      transform: scale(1.05);
      border-color: var(--primary);
      box-shadow: 0 0 30px var(--primary-glow);
    }

    /* Trạng thái đang ghi âm */
    #btn-record.recording {
      background: linear-gradient(145deg, #b91c1c, #991b1b);
      border-color: var(--danger);
      box-shadow: 0 0 40px var(--danger-glow);
      transform: scale(0.95);
      animation: pulse-danger 1.5s infinite;
    }

    /* Vòng sóng âm thanh lan tỏa */
    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    #btn-record.recording ~ .ripple {
      background: var(--danger);
      animation: ripple-effect 1.5s linear infinite;
    }

    .hint {
      margin-top: 30px;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 500;
      z-index: 10;
    }

    /* Hộp kết quả Glassmorphism */
    .result-box {
      margin-top: 20px;
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      min-height: 100px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      display: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .result-box.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
      animation: slideUp 0.4s ease forwards;
    }

    .result-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ai-accent);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-label::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--ai-accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--ai-accent);
    }

    .result-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.6;
    }

    .result-msg {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-msg.success { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
    .result-msg.error   { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

    /* Trạng thái Loading AI */
    .loading {
      display: none;
      margin-top: 20px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
    }

    .loading.visible { display: flex; animation: fadeIn 0.3s ease; }

    .ai-dots {
      display: flex;
      gap: 4px;
    }
    .ai-dots div {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .ai-dots div:nth-child(1) { animation-delay: -0.32s; }
    .ai-dots div:nth-child(2) { animation-delay: -0.16s; }

    .loading span {
      font-size: 14px;
      color: var(--primary);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Hướng dẫn lệnh */
    .commands {
      margin-top: 40px;
      width: 100%;
      max-width: 480px;
    }

    .commands h3 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: left;
      padding-left: 8px;
    }

    .cmd-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .cmd-item {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 14px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      cursor: default;
    }

    .cmd-item:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }

    .cmd-icon {
      font-size: 18px;
      background: rgba(255,255,255,0.05);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    /* Animations */
    @keyframes pulse-danger {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes ripple-effect {
      0% { width: 120px; height: 120px; opacity: 0.5; }
      100% { width: 300px; height: 300px; opacity: 0; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Ẩn thanh cuộn */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TDT's House AI</h1>
    <p>Voice-Controlled Smart Lighting System</p>
  </div>

  <div class="control-center">
    <button id="btn-record">🎙️</button>
    <div class="ripple"></div>
    <p class="hint">Nhấn giữ để ra lệnh</p>
  </div>

  <div class="loading" id="loading">
    <div class="ai-dots"><div></div><div></div><div></div></div>
    <span>AI đang giải mã giọng nói...</span>
  </div>

  <div class="result-box" id="result-box">
    <div class="result-label">Lệnh nhận diện</div>
    <div class="result-text" id="result-text">—</div>
    <div class="result-msg" id="result-msg"></div>
  </div>

  <div class="commands">
    <h3>Lệnh khả dụng</h3>
    <div class="cmd-list">
      <div class="cmd-item">
        <span class="cmd-icon">💡</span>
        <span>"Bật đèn hành lang"</span>
      </div>
      <div class="cmd-item">
        <span class="cmd-icon">🌙</span>
        <span>"Tắt đèn phòng ngủ"</span>
      </div>
      <div class="cmd-item">
        <span class="cmd-icon">🍳</span>
        <span>"Bật đèn sân vườn"</span>
      </div>
      <div class="cmd-item">
        <span class="cmd-icon">✨</span>
        <span>"Bật đèn phòng ngủ"</span>
      </div>
    </div>
  </div>

  <script>
    const btn       = document.getElementById('btn-record');
    const loading   = document.getElementById('loading');
    const resultBox = document.getElementById('result-box');
    const resultTxt = document.getElementById('result-text');
    const resultMsg = document.getElementById('result-msg');

    let mediaRecorder = null;
    let audioChunks   = [];
    let isRecording   = false;

    async function startRecording() {
      if (isRecording) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks  = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          await sendAudio();
        };

        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
        btn.innerHTML = '⏹️';

      } catch (err) {
        alert('Không truy cập được microphone. Kiểm tra quyền trình duyệt.\n' + err.message);
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      mediaRecorder.stop();
      isRecording = false;
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️';
    }

    async function sendAudio() {
      if (audioChunks.length === 0) return;

      loading.classList.add('visible');
      resultBox.classList.remove('visible');

      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const form = new FormData();
      form.append('audio', blob, 'voice.webm');

      try {
        const res  = await fetch('/transcribe', { method: 'POST', body: form });
        const data = await res.json();

        resultTxt.textContent = data.text || '(Không nhận dạng được mệnh lệnh)';
        
        // Thêm icon vào message để trực quan hơn
        const isSuccess = data.success;
        resultMsg.innerHTML = (isSuccess ? '✓ ' : '⚠ ') + (data.message || (data.error ? data.error : ''));
        resultMsg.className = 'result-msg ' + (isSuccess ? 'success' : 'error');
        
        resultBox.classList.add('visible');

      } catch (err) {
        resultTxt.textContent = 'Mất kết nối với máy chủ AI';
        resultMsg.innerHTML = '⚠ ' + err.message;
        resultMsg.className = 'result-msg error';
        resultBox.classList.add('visible');
      } finally {
        loading.classList.remove('visible');
      }
    }

    // Sự kiện nhấn giữ
    btn.addEventListener('mousedown',  startRecording);
    btn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
    btn.addEventListener('mouseup',    stopRecording);
    btn.addEventListener('touchend',   stopRecording);
    btn.addEventListener('mouseleave', stopRecording);
  </script>
</body>
</html>
